<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaTrack — Login</title>
<link rel="stylesheet" href="css/base.css">
<style>
.auth-container {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--dark);
}
.auth-card {
  background: var(--card-bg);
  padding: 3rem 2.5rem;
  border-radius: 24px;
  width: 400px;
  border: 1px solid rgba(2,195,154,0.2);
  text-align: center;
}
.auth-card h2 {
  font-family: 'DM Serif Display', serif;
  margin-bottom: 0.5rem;
}
.auth-card p {
  color: rgba(255,255,255,0.45);
  font-size: 0.9rem;
  margin-bottom: 2rem;
}
.btn-google {
  width: 100%;
  padding: 0.9rem;
  border-radius: 100px;
  background: #fff;
  color: #1a1a1a;
  border: none;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  text-decoration: none;
  transition: box-shadow 0.2s, transform 0.2s;
  font-family: 'DM Sans', sans-serif;
}
.btn-google:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(255,255,255,0.15);
}
.btn-google img {
  width: 20px;
  height: 20px;
}
.divider {
  margin: 1.5rem 0;
  display: flex;
  align-items: center;
  gap: 1rem;
  color: rgba(255,255,255,0.2);
  font-size: 0.8rem;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.1);
}
.brand-logo {
  font-family: 'DM Serif Display', serif;
  font-size: 1.8rem;
  margin-bottom: 1.5rem;
  display: block;
  text-decoration: none;
  color: white;
}
.brand-logo span { color: var(--mint); }
</style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <a href="index.html" class="brand-logo">Pharm<span>Track</span></a>
    <h2>Welcome Back</h2>
    <p>Sign in to access your medicine dashboard, reminders, and emergency features.</p>

    <a href="/auth/google" class="btn-google">
      <!-- Google SVG logo -->
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </a>
  </div>
</div>

</body>
</html>
